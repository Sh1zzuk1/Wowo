<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            font-family: 'Arial', sans-serif;
        }
        .registration-form {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }
        .registration-form h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .registration-form input,
        .registration-form select,
        .registration-form textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .registration-form button {
            padding: 12px 20px;
            background-color: #ff69b4;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        .registration-form button:hover {
            background-color: #ff1493;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input {
            font-size: 14px;
            color: #555;
        }
        .file-input-button {
            background-color: #ff69b4;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            display: inline-block;
            text-align: center;
        }
        .file-input-button:hover {
            background-color: #ff1493;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }
        .success-message {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .heart {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff69b4;
            transform: rotate(-45deg);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 50% 80%, 18% 100%, 0 38%);
            animation: float 1s linear infinite;
        }
        @keyframes float {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-150px) scale(0);
            }
        }
    </style>
</head>
<body>

<div class="registration-form" id="registrationForm">
    <h2>Анкета</h2>
    <form id="regForm" onsubmit="register(event)">
        <input type="text" name="name" placeholder="Имя" required>
        <select name="gender" required>
            <option value="" disabled selected>Выберите пол</option>
            <option value="Мужской">Мужской</option>
            <option value="Женский">Женский</option>
        </select>
        <select name="looking_for" required>
            <option value="" disabled selected>Кого ищете</option>
            <option value="Мужской">Мужской</option>
            <option value="Женский">Женский</option>
        </select>
        <input type="number" name="age" placeholder="Возраст" required>
        <textarea name="about" placeholder="Расскажите о себе" rows="4" required></textarea>
        <select name="country" id="country" onchange="populateCities()" required>
            <option value="" disabled selected>Выберите страну</option>
            <option value="Россия">Россия</option>
            <option value="Украина">Украина</option>
            <option value="Беларусь">Беларусь</option>
        </select>
        <select name="city" id="city" required>
            <option value="" disabled selected>Выберите город</option>
        </select>
        <div class="file-input-wrapper">
            <button class="file-input-button" type="button">Загрузите свое фото</button>
            <input type="file" name="photo" class="file-input" accept="image/*" required>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
</div>

<div class="success-message" id="successMessage">
    <p>Регистрация успешна!</p>
</div>

<script>
    const ADMIN_CHAT_ID = '1967194476';

    async function register(event) {
        event.preventDefault();
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');

        if (!chatId) {
            alert('Не удалось получить chat_id. Пожалуйста, попробуйте позже.');
            return;
        }

        const form = document.getElementById('regForm');
        const formData = new FormData(form);

        const data = {
            name: formData.get('name'),
            gender: formData.get('gender'),
            looking_for: formData.get('looking_for'),
            age: formData.get('age'),
            about: formData.get('about'),
            country: formData.get('country'),
            city: formData.get('city')
        };

        await sendTelegramMessage(chatId, data);
        await sendTelegramMessage(ADMIN_CHAT_ID, data);

        const photoFile = formData.get('photo');
        if (photoFile) {
            await sendTelegramPhoto(chatId, photoFile);
            await sendTelegramPhoto(ADMIN_CHAT_ID, photoFile);
        }

        document.getElementById('registrationForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
        releaseHearts(event);
    }

    async function sendTelegramMessage(chatId, data) {
        const token = new URLSearchParams(window.location.search).get('tg_token');
        try {
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: `Регистрация успешна! \nДанные пользователя:\nИмя: ${data.name},\nПол: ${data.gender},\nИщет: ${data.looking_for},\nВозраст: ${data.age},\nО себе: ${data.about},\nСтрана: ${data.country},\nГород: ${data.city}`
                })
            });
        } catch (error) {
            console.error('Ошибка при отправке данных:', error);
        }
    }

    async function sendTelegramPhoto(chatId, photoFile) {
        const token = new URLSearchParams(window.location.search).get('tg_token');
        const photoData = new FormData();
        photoData.append('chat_id', chatId);
        photoData.append('photo', photoFile);

        try {
            await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: 'POST',
                body: photoData
            });
        } catch (error) {
            console.error('Ошибка при отправке фото:', error);
        }
    }
</script>

</body>
</html>
